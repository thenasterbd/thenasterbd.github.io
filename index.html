<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arte Suave SC - BJJ Timer</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="pantalla-inicio" class="text-center">
        <div id="logo-container-inicio" class="mb-4">
            <img src="logo.png" alt="Logo Academia" class="logo-gigante">
        </div>
        <div id="reloj-contenedor">
            <div id="hora-actual">00:00:00</div>
        </div>
        <button class="btn btn-outline-light btn-lg mt-5 px-5 py-3 fw-bold fs-2 shadow" onclick="mostrarConfiguracion()">
            CONFIGURAR
        </button>
    </div>

    <div class="container-fluid d-flex flex-column align-items-center justify-content-center">
        <div class="card shadow-lg config-card p-4" id="panel-config" style="display: none;">
            <h2 class="text-center fw-bold mb-4">AJUSTES</h2>
            
            <div class="mb-3 d-flex align-items-center justify-content-between">
                <label class="h4 mb-0 fw-bold">TIEMPO:</label>
                <input type="number" id="inWork" class="form-control w-50 custom-input" value="5" min="1" max="15" step="1">
            </div>
            
            <div class="mb-3 d-flex align-items-center justify-content-between">
                <label class="h4 mb-0 fw-bold">DESCANSO:</label>
                <input type="number" id="inRest" class="form-control w-50 custom-input" value="2" min="0" step="0.1" >
            </div>
            
            <div class="mb-4 d-flex align-items-center justify-content-between">
                <label class="h4 mb-0 fw-bold">ROUNDS:</label>
                <input type="number" id="inRounds" class="form-control w-50 custom-input" value="6" min="1">
            </div>

            <button class="btn btn-dark btn-lg w-100 py-3 fw-bold fs-2 shadow mb-2" onclick="prepararEntrenamiento()">
                INICIAR
            </button>
            <button class="btn btn-link text-dark w-100" onclick="location.reload()">VOLVER</button>
        </div>

        <div id="panel-timer" class="text-center w-100" style="display: none;">
            <div id="logo-timer-container">
                <img src="logo.png" alt="Logo Academia" class="logo-pequeno">
            </div>
            
            <h2 class="status-text mb-0" id="label-status">LISTO</h2>
            <div class="timer-display" id="display-time">00:00</div>
            
            <div class="mb-2">
                <span class="round-text" id="label-round">ROUND: 1 / 6</span>
            </div>
           <div class="botones-container">
    <div class="botones-container-inner">
        <button class="btn btn-primary custom-btn shadow" id="btn-pausa" onclick="togglePausa()">
            PAUSA
        </button>
        
        <button class="btn btn-warning custom-btn shadow text-dark" id="btn-reiniciar" onclick="reiniciarRound()">
            REINICIAR
        </button>
        
        <button class="btn btn-outline-light custom-btn shadow" onclick="location.reload()">
            SALIR
        </button>
    </div>
</div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
