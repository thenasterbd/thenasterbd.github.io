<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> BJJ - Arte Suave SC</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container-fluid min-vh-100 d-flex flex-column align-items-center justify-content-center p-3">
        
        <div id="logo-container" class="mb-4 text-center">
            <img src="logo.png" alt="Logo" class="img-fluid main-logo">
        </div>

        <div class="card shadow-lg config-card p-4" id="panel-config">
            <h1 class="text-center fw-bold mb-4">ARTE SUAVE SC</h1>
            
            <div class="mb-3 d-flex align-items-center justify-content-between">
                <label class="h5 mb-0">TRABAJO (Min):</label>
                <input type="number" id="inWork" class="form-control w-50 custom-input" value="5" min="0.1" step="0.1">
            </div>
            
            <div class="mb-3 d-flex align-items-center justify-content-between">
                <label class="h5 mb-0">DESCANSO (Min):</label>
                <input type="number" id="inRest" class="form-control w-50 custom-input" value="2" min="0.1" step="0.1">
            </div>
            
            <div class="mb-4 d-flex align-items-center justify-content-between">
                <label class="h5 mb-0">ROUNDS:</label>
                <input type="number" id="inRounds" class="form-control w-50 custom-input" value="6" min="1">
            </div>

            <button class="btn btn-dark btn-lg w-100 py-3 fw-bold fs-3" onclick="prepararEntrenamiento()">
                INICIAR
            </button>
        </div>

        <div id="panel-timer" class="text-center w-100" style="display: none;">
            <h2 class="display-3 fw-bold status-text mb-0" id="label-status">LISTO</h2>
            <div class="timer-display fw-black" id="display-time">00:00</div>
            <h3 class="display-5 round-text mb-5" id="label-round">ROUND: 1 / 6</h3>
            
            <div class="row g-3 justify-content-center">
                <div class="col-12 col-md-5">
                    <button class="btn btn-primary btn-lg w-100 py-3 fw-bold fs-2 shadow" id="btn-pausa" onclick="togglePausa()">
                        PAUSA
                    </button>
                </div>
                <div class="col-12 col-md-5">
                    <button class="btn btn-outline-light btn-lg w-100 py-3 fw-bold fs-2" onclick="location.reload()">
                        SALIR
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
